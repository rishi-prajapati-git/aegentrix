services:
  - type: web
    name: aegentrix-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt || pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT || uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: APPROVAL_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: aegentrix-postgres
          property: connectionString

databases:
  - name: aegentrix-postgres
    plan: free
    region: oregon
    databaseName: aegentrix
    user: aegentrix_user
