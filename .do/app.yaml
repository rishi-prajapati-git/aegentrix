name: aegentrix-platform
region: nyc

services:
  - name: backend
    dockerfile_path: Dockerfile.backend
    source_dir: /
    http_port: 8000
    instance_count: 1
    instance_size_slug: basic-xxs
    routes:
      - path: /api
      - path: /health
      - path: /docs
      - path: /openapi.json
    envs:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        value: ${db.DATABASE_URL}
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: APPROVAL_SECRET_KEY
        value: aegentrix-hmac-secret-token-change-in-prod
        type: SECRET
      - key: AI_ANALYSIS_ENABLED
        value: "false"

  - name: frontend
    dockerfile_path: Dockerfile.frontend
    source_dir: /
    http_port: 3000
    instance_count: 1
    instance_size_slug: basic-xxs
    routes:
      - path: /
    envs:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: ${backend.PUBLIC_URL}

databases:
  - name: db
    engine: PG
    version: "16"
    production: false
    cluster_name: aegentrix-pg-db
